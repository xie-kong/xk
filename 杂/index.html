<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 GitHub 图床</title>
<style>
    :root{
        --bg:#f4f4f4;
        --surface:#ffffff;
        --line:#e3e3e3;
        --line-dark:#111111;
        --ink:#111111;
        --ink-2:#6b6b6b;
        --ink-3:#a6a6a6;
        --danger:#b00020;
        --radius:2px;
    }
    *{
        box-sizing:border-box;margin:0;padding:0;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Helvetica Neue",Roboto,Arial,sans-serif;
    }
    input,button,select,textarea{font:inherit;}
    body{
        background:var(--bg);color:var(--ink);
        padding-bottom:60px;
        -webkit-font-smoothing:antialiased;
    }
    body.dragging-active{user-select:none;-webkit-user-select:none;}

    /* ---------- 顶栏 ---------- */
    .header{
        background:var(--surface);
        height:64px;padding:0 24px;
        display:flex;justify-content:space-between;align-items:center;
        border-bottom:1px solid var(--line-dark);
        position:sticky;top:0;z-index:50;
    }
    .header h1{font-size:16px;font-weight:600;letter-spacing:0.06em;}
    .header .sub{font-size:10px;color:var(--ink-3);letter-spacing:0.18em;margin-top:3px;}

    /* ---------- 按钮 ---------- */
    .btn{
        padding:9px 16px;
        border:1px solid var(--line-dark);
        border-radius:var(--radius);
        background:var(--surface);color:var(--ink);
        font-size:13px;font-weight:500;letter-spacing:0.02em;
        cursor:pointer;transition:background .15s,color .15s,border-color .15s;
    }
    .btn:hover{background:var(--ink);color:#fff;}
    .btn-solid{background:var(--ink);color:#fff;}
    .btn-solid:hover{background:#3a3a3a;border-color:#3a3a3a;}
    .btn-ghost{border-color:var(--line);color:var(--ink-2);}
    .btn-ghost:hover{background:#f0f0f0;color:var(--ink);border-color:var(--line-dark);}

    /* ---------- 布局 ---------- */
    .container{max-width:1040px;margin:24px auto;padding:0 24px;}

    .card{
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:var(--radius);
        padding:22px 24px;
        margin-bottom:18px;
    }
    .card h2{
        font-size:12px;font-weight:600;letter-spacing:0.18em;color:var(--ink-2);
        padding-bottom:12px;margin-bottom:16px;
        border-bottom:1px solid var(--line);
    }

    /* ---------- 输入框 ---------- */
    .field{
        width:100%;
        padding:10px 12px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        color:var(--ink);
        font-size:13px;
        outline:none;
        transition:border-color .15s;
    }
    .field:focus{border-color:var(--line-dark);}
    select.field{
        appearance:none;-webkit-appearance:none;
        padding-right:32px;
        background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%236b6b6b' stroke-width='1.4'/%3E%3C/svg%3E");
        background-repeat:no-repeat;
        background-position:right 12px center;
        cursor:pointer;
    }

    /* Token 行 */
    .token-area{display:flex;gap:10px;align-items:stretch;}
    .token-area .field{flex:1;min-width:0;}
    .token-area .btn{
        padding:0 18px;
        font-size:12px;
        letter-spacing:0.04em;
        white-space:nowrap;
    }

    /* ---------- 上传区 ---------- */
    .upload-bar{
        display:flex;align-items:center;gap:10px;flex-wrap:wrap;
        margin-bottom:14px;
    }
    .upload-bar .label{
        font-size:12px;color:var(--ink-2);letter-spacing:0.06em;white-space:nowrap;
    }
    .upload-bar select{flex:1;min-width:160px;}

    .upload-area{
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:#fafafa;
        padding:44px 20px;
        text-align:center;
        cursor:pointer;
        transition:border-color .15s,background .15s;
    }
    .upload-area:hover,.upload-area.dragover{border-color:var(--line-dark);background:#fff;}
    .upload-area .plus{font-size:20px;font-weight:300;line-height:1;color:var(--ink-2);margin-bottom:14px;}
    .upload-area p{font-size:13px;color:var(--ink-2);}
    .upload-area .hint{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.6;}
    .upload-area input[type="file"]{display:none;}

    /* ---------- 进度 ---------- */
    .progress-list{margin-top:16px;}
    .progress-item{margin-bottom:14px;font-size:12px;color:var(--ink-2);}
    .progress-item .row{display:flex;justify-content:space-between;gap:12px;}
    .progress-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .status{font-weight:600;white-space:nowrap;color:var(--ink-2);}
    .status.success{color:var(--ink);}
    .status.error{color:var(--danger);}
    .bar{height:3px;background:#ececec;margin-top:7px;overflow:hidden;}
    .bar > div{height:100%;width:0%;background:var(--ink);transition:width .2s;}

    /* ---------- 图库头部 sticky ---------- */
    .gallery-header{
        position:sticky;
        top:64px;
        background:var(--surface);
        z-index:40;
        padding:22px 24px 0;
        margin:-22px -24px 0 -24px;
        border-bottom:1px solid var(--line);
    }
    .gallery-header h2{
        margin-bottom:16px;
        padding-bottom:0;
        border-bottom:none;
    }
    .gallery-header .album-tabs{
        margin-bottom:16px;
    }

    /* ---------- 视图切换 + 搜索 ---------- */
    .album-tabs{
        display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    }
    .album-tab{
        padding:6px 14px;
        font-size:12px;letter-spacing:0.02em;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        color:var(--ink-2);
        cursor:pointer;
        transition:background .15s,color .15s,border-color .15s;
    }
    .album-tab:hover{border-color:var(--line-dark);color:var(--ink);}
    .album-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
    .album-tab.spacer{margin-left:auto;border:none;background:none;pointer-events:none;}
    .album-tab.confirm{background:var(--ink);border-color:var(--ink);color:#fff;}
    .album-tab.confirm:hover{background:#3a3a3a;border-color:#3a3a3a;}
    .view-title{
        font-size:12px;color:var(--ink-3);letter-spacing:0.06em;padding-left:2px;
    }

    /* 搜索框 */
    .search-box{
        margin-left:auto;
        display:flex;align-items:center;
    }
    .search-box input{
        width:180px;
        padding:6px 10px;
        font-size:12px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        color:var(--ink);
        outline:none;
        transition:border-color .15s,width .2s;
    }
    .search-box input:focus{
        border-color:var(--line-dark);
        width:220px;
    }
    .search-box input::placeholder{color:var(--ink-3);}

    /* ---------- 双排正方形网格 ---------- */
    .gallery{
        display:grid;
        grid-template-columns:repeat(2, minmax(0,1fr));
        gap:16px;
    }
    .empty{
        grid-column:1/-1;text-align:center;color:var(--ink-3);
        font-size:13px;padding:36px 0;
    }
    .empty.error{color:var(--danger);}
    .ph{font-size:12px;color:var(--ink-3);}

    /* 搜索高亮 */
    .search-highlight{
        outline:2px solid var(--ink);
        outline-offset:2px;
        transition:outline .2s;
    }

    /* ---------- 排序模式 ---------- */
    .gallery.sorting .file-card,
    .gallery.sorting .album-card{
        touch-action:none;
        cursor:grab;
        transition:border-color .15s, opacity .15s;
    }
    .gallery.sorting .is-dragging{
        pointer-events:none;
        opacity:.35;
        border-color:var(--line-dark);
    }
    .gallery.sorting .file-card:active,
    .gallery.sorting .album-card:active{cursor:grabbing;}

    /* ---------- 文件卡（正方形） ---------- */
    .file-card{
        aspect-ratio:1 / 1;
        display:flex;flex-direction:column;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        overflow:hidden;
        transition:border-color .15s;
    }
    .file-card:hover{border-color:var(--line-dark);}

    .file-preview{
        flex:1;min-height:0;
        background:#f0f0f0;
        border-bottom:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;
    }
    /* 图片完整显示，不裁剪 */
    .file-preview img{
        width:100%;
        height:100%;
        object-fit:contain;
        display:block;
        cursor:zoom-in;
    }
    .file-preview audio{width:92%;}

    .file-info{
        flex:0 0 auto;
        padding:10px 12px 12px;
        display:flex;flex-direction:column;gap:7px;
    }
    .file-name{
        font-size:12px;font-weight:600;line-height:1.35;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .file-origin{
        font-size:10px;color:var(--ink-3);line-height:1.3;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        margin-top:-4px;
    }

    /* ---------- 链接行 ---------- */
    .link-row{display:flex;gap:5px;align-items:stretch;}
    .link-row .file-input{
        flex:1;min-width:0;
        height:28px;
        padding:0 8px;
        font-size:11px;
        color:var(--ink-2);
        background:#fafafa;
        border:1px solid var(--line);
        border-radius:var(--radius);
        outline:none;
        cursor:text;
    }
    .link-row .file-input:focus{border-color:var(--line-dark);color:var(--ink);}
    .link-row .btn-copy{
        flex:0 0 auto;
        height:28px;
        padding:0 10px;
        font-size:11px;
        color:var(--ink-2);
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:var(--radius);
        cursor:pointer;
        white-space:nowrap;
        transition:background .15s,color .15s,border-color .15s;
    }
    .link-row .btn-copy:hover{
        border-color:var(--line-dark);color:var(--ink);background:#f7f7f7;
    }

    /* ---------- 相册卡（正方形） ---------- */
    .album-card{
        aspect-ratio:1 / 1;
        display:flex;flex-direction:column;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        overflow:hidden;
        cursor:pointer;
        transition:border-color .15s;
    }
    .album-card:hover{border-color:var(--line-dark);}

    .album-cover{
        flex:1;min-height:0;
        background:#f0f0f0;
        border-bottom:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;
        overflow:hidden;
    }
    .album-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .album-cover .ph{font-size:11px;letter-spacing:0.2em;color:var(--ink-3);}

    .album-info{
        flex:0 0 auto;
        padding:10px 12px 12px;
        display:flex;flex-direction:column;gap:5px;
    }
    .album-name{
        font-size:12px;font-weight:600;line-height:1.35;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .album-meta{
        font-size:10px;color:var(--ink-3);line-height:1.3;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .album-info .card-actions{margin-top:5px;}

    /* ---------- 卡片按钮 ---------- */
    .card-actions{display:flex;gap:5px;}
    .card-actions > *{
        flex:1 1 0;min-width:0;
        padding:6px 2px;
        font-size:10.5px;letter-spacing:0.01em;
        text-align:center;text-decoration:none;
        color:var(--ink-2);background:var(--surface);
        border:1px solid var(--line);border-radius:var(--radius);
        cursor:pointer;white-space:nowrap;overflow:hidden;
        transition:background .15s,color .15s,border-color .15s;
    }
    .card-actions > *:hover{
        border-color:var(--line-dark);color:var(--ink);background:#f7f7f7;
    }
    .card-actions .btn-del:hover{
        border-color:var(--danger);color:var(--danger);background:#fff;
    }

    /* ---------- 灯箱（点击查看大图） ---------- */
    .lightbox{
        position:fixed;inset:0;
        background:rgba(0,0,0,.9);
        display:none;
        align-items:center;justify-content:center;
        padding:32px;
        z-index:1000;
        cursor:zoom-out;
    }
    .lightbox.show{display:flex;}
    .lightbox img{
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        display:block;
        cursor:default;
    }

    /* ---------- 相册选择弹窗 ---------- */
    .modal-overlay{
        position:fixed;inset:0;
        background:rgba(0,0,0,.45);
        display:none;
        align-items:center;justify-content:center;
        padding:24px;
        z-index:1100;
    }
    .modal-overlay.show{display:flex;}
    .modal-box{
        background:var(--surface);
        border:1px solid var(--line-dark);
        border-radius:var(--radius);
        padding:22px 24px;
        width:100%;max-width:440px;
        max-height:85vh;
        display:flex;flex-direction:column;
    }
    .modal-box h3{
        font-size:13px;font-weight:600;letter-spacing:0.1em;
        margin-bottom:8px;
    }
    .modal-box .modal-sub{
        font-size:11px;color:var(--ink-3);margin-bottom:14px;
        line-height:1.5;word-break:break-all;
    }
    .album-choice-list{
        display:flex;flex-wrap:wrap;gap:8px;
        overflow-y:auto;
        padding:2px 0 12px;
        max-height:44vh;
    }
    .album-choice{
        padding:8px 14px;
        font-size:12px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--surface);
        color:var(--ink-2);
        cursor:pointer;
        transition:background .15s,color .15s,border-color .15s;
    }
    .album-choice:hover{border-color:var(--line-dark);color:var(--ink);}
    .album-choice.current{
        background:var(--ink);border-color:var(--ink);color:#fff;
        cursor:default;
    }
    .album-choice.root{border-style:dashed;}
    .new-album-row{
        display:flex;gap:8px;
        margin-top:8px;
        padding-top:14px;
        border-top:1px solid var(--line);
    }
    .new-album-row .field{flex:1;min-width:0;padding:8px 10px;font-size:12px;}
    .new-album-row .btn{padding:0 14px;font-size:12px;white-space:nowrap;}
    .modal-actions{
        display:flex;gap:8px;margin-top:14px;
    }
    .modal-actions .btn{flex:1;text-align:center;}

    /* ---------- Toast ---------- */
    .toast{
        position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
        background:var(--ink);color:#fff;
        padding:11px 22px;border-radius:var(--radius);
        font-size:13px;letter-spacing:0.02em;
        opacity:0;pointer-events:none;transition:opacity .25s;
        z-index:999;max-width:80vw;
    }
    .toast.show{opacity:1;}
    .toast.error{background:var(--danger);}

    @media (max-width:520px){
        .container{padding:0 14px;}
        .card{padding:18px 16px;}
        .gallery{gap:12px;}
        .card-actions > *{font-size:10px;padding:6px 0;}
        .link-row .btn-copy{padding:0 8px;}
        .search-box input{width:130px;}
        .search-box input:focus{width:160px;}
        .gallery-header{padding:18px 16px 0;margin:-18px -16px 0 -16px;}
    }
</style>
</head>
<body>

<div class="header">
    <div>
        <h1>我的 GitHub 图床</h1>
        <div class="sub">GITHUB IMAGE HOST</div>
    </div>
    <button class="btn btn-ghost" onclick="loadGallery()">刷新图库</button>
</div>

<div class="container">

    <!-- Token 设置 -->
    <div class="card">
        <h2>TOKEN 设置</h2>
        <div class="token-area">
            <input type="password" class="field" id="tokenInput"
                   placeholder="请输入 GitHub Personal Access Token (ghp_...)" />
            <button class="btn btn-solid" onclick="saveToken()">保存</button>
        </div>
    </div>

    <!-- 上传区 -->
    <div class="card">
        <h2>上传文件</h2>

        <div class="upload-bar">
            <span class="label">目标相册</span>
            <select class="field" id="albumSelect">
                <option value="">未分类（根目录）</option>
            </select>
            <button class="btn btn-ghost" onclick="addAlbum()">＋ 新建相册</button>
        </div>

        <div class="upload-area" id="dropZone"
             onclick="document.getElementById('fileInput').click()">
            <div class="plus">＋</div>
            <p>点击选择文件，或将文件拖拽到这里</p>
            <p class="hint">支持 jpg / jpeg / png / gif / webp / svg / bmp / ico<br>
               以及 mp3 / wav / m4a / ogg / flac / aac</p>
            <input type="file" id="fileInput" multiple
       accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac" />
        </div>

        <div class="progress-list" id="progressList"></div>
    </div>

    <!-- 图库区 -->
    <div class="card">
        <div class="gallery-header" id="galleryHeader">
            <h2>我的图库</h2>
            <div class="album-tabs" id="viewTabs">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索备注/文件名" />
                </div>
            </div>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

</div>

<div class="toast" id="toast"></div>

<!-- 灯箱：点击图片查看大图 -->
<div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="" />
</div>

<!-- 相册选择弹窗（移入 / 移出） -->
<div class="modal-overlay" id="albumModal">
    <div class="modal-box">
        <h3>移动到相册</h3>
        <div class="modal-sub" id="albumModalFileName"></div>
        <div class="album-choice-list" id="albumChoiceList"></div>
        <div class="new-album-row">
            <input type="text" class="field" id="newAlbumInput"
                   placeholder="输入新相册名，回车创建并移入…" />
            <button class="btn" id="newAlbumBtn">创建并移入</button>
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="albumModalCancel">取消</button>
        </div>
    </div>
</div>

<script>
/* ================= 配置区 ================= */
const USERNAME = 'xie-kong'; // 你的 GitHub 用户名
const REPO     = 'xk';       // 你的仓库名
const BRANCH   = 'main';     // 分支名
/* ========================================== */

const API_BASE = `https://api.github.com/repos/${USERNAME}/${REPO}/contents`;

const IMG_EXTS   = ['jpg','jpeg','png','gif','webp','svg','bmp','ico'];
const AUDIO_EXTS = ['mp3','wav','m4a','ogg','flac','aac'];
const VALID_EXTS = [...IMG_EXTS, ...AUDIO_EXTS];
const MAX_SIZE   = 50 * 1024 * 1024;

/* ---------------- 全局状态 ---------------- */
let token = localStorage.getItem('github_token') || '';

let notes = {};
try { notes = JSON.parse(localStorage.getItem('gh_notes') || '{}') || {}; } catch (e) { notes = {}; }

let albumRegistry = [];
try { albumRegistry = JSON.parse(localStorage.getItem('gh_albums') || '[]') || []; } catch (e) { albumRegistry = []; }
if (!Array.isArray(albumRegistry)) albumRegistry = [];

let orders = {};
try { orders = JSON.parse(localStorage.getItem('gh_order') || '{}') || {}; } catch (e) { orders = {}; }
if (!orders || typeof orders !== 'object') orders = {};

let allFiles = [];
let view = 'all';
let sortState = null;

const galleryEl = document.getElementById('gallery');

/* ---------------- 小工具 ---------------- */
function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.className = 'toast', 2500);
}

function encodePath(p) {
    return String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/');
}

function contentsUrl(path) {
    const ep = encodePath(path);
    return ep ? `${API_BASE}/${ep}` : API_BASE;
}

function apiHeaders() {
    const h = { 'Accept': 'application/vnd.github.v3+json' };
    if (token) h['Authorization'] = `token ${token}`;
    return h;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = reject;
    });
}

function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
}

function extOf(name) {
    return (String(name).split('.').pop() || '').toLowerCase();
}

function publicUrl(path) {
    return `https://${USERNAME}.github.io/${REPO}/${encodePath(path)}`;
}

function makePh(text) {
    const span = document.createElement('span');
    span.className = 'ph';
    span.textContent = text;
    return span;
}

/* ---------------- 灯箱 ---------------- */
const lightboxEl = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function openLightbox(src, alt) {

/* ---------------- GitHub 读取 ---------------- */
async function fetchDir(path) {
    const res = await fetch(`${contentsUrl(path)}?ref=${BRANCH}`, {
        headers: apiHeaders(),
        cache: 'no-store'
    });
    if (res.status === 404) return [];
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `请求失败 (${res.status})`);
    }
    const data = await res.json();
    return Array.isArray(data) ? data : [];
}

async function loadGallery() {
    galleryEl.innerHTML = '<p class="empty">加载中…</p>';
    sortState = null;

    try {
        const root = await fetchDir('');
        const files = [];

        for (const item of root) {
            if (item.type === 'dir') {
                const subs = await fetchDir(item.path);
                subs.filter(s => s.type === 'file').forEach(s => {
                    files.push({ name: s.name, path: s.path, sha: s.sha, album: item.name });
                });
            } else if (item.type === 'file') {
                if (item.name === 'README.md' || item.name === '.gitignore') continue;
                files.push({ name: item.name, path: item.path, sha: item.sha, album: '' });
            }
        }

        allFiles = files;
        renderAlbumOptions();
        render();
    } catch (err) {
        galleryEl.innerHTML = `<p class="empty error">加载失败：${escapeHtml(err.message)}</p>`;
    }
}

/* ---------------- 相册列表 ---------------- */
function albumList() {
    const set = new Set(albumRegistry);
    allFiles.forEach(f => { if (f.album) set.add(f.album); });
    return [...set].sort((a, b) => a.localeCompare(b, 'zh'));
}

function countOfAlbum(name) {
    return allFiles.filter(f => f.album === name).length;
}

function coverOfAlbum(name) {
    const f = allFiles.find(x =>
        x.album === name && IMG_EXTS.includes(extOf(x.name))
    );
    return f ? publicUrl(f.path) : '';
}

/* ---------------- 排序持久化 ---------------- */
function sortKeyForView() {
    if (view === 'albums') return 'albums';
    if (view.startsWith('album:')) return 'album:' + view.slice(6);
    return 'all';
}

function applyOrder(items, key) {
    const ord = orders[key];
    if (!ord || !ord.length) return items;
    const idx = new Map(ord.map((id, i) => [id, i]));
    return items.slice().sort((a, b) => {
        const ia = idx.has(a.id) ? idx.get(a.id) : Number.MAX_SAFE_INTEGER;
        const ib = idx.has(b.id) ? idx.get(b.id) : Number.MAX_SAFE_INTEGER;
        return ia - ib;
    });
}

/* ---------------- 渲染入口 ---------------- */
function render() {
    const albums = albumList();

    if (view === 'albums' && albums.length === 0) view = 'all';
    if (view.startsWith('album:')) {
        const name = view.slice(6);
        if (!albums.includes(name)) view = albums.length ? 'albums' : 'all';
    }

    galleryEl.classList.toggle('sorting', !!sortState);
    renderViewTabs();

    if (view === 'albums') renderAlbums();
    else renderFiles();
}

/* ---------------- 拖拽排序 ---------------- */
let dragCleanup = null;

galleryEl.addEventListener('pointerdown', (e) => {
    if (!sortState) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    const card = e.target.closest('.file-card, .album-card');
    if (!card || card.parentNode !== galleryEl) return;
    if (e.target.closest('button, a, input, select, textarea')) return;

    const startX = e.clientX;
    const startY = e.clientY;
    let timer = null;
    let aborted = false;

    const abort = () => {
        aborted = true;
        clearTimeout(timer);
        document.removeEventListener('pointermove', onMoveEarly);
        document.removeEventListener('pointerup', abort);
        document.removeEventListener('pointercancel', abort);
    };

    const onMoveEarly = (ev) => {
        if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) {
            abort();
        }
    };

    document.addEventListener('pointermove', onMoveEarly, { passive: true });
    document.addEventListener('pointerup', abort, { once: true });
    document.addEventListener('pointercancel', abort, { once: true });

    timer = setTimeout(() => {
        abort();
        if (aborted && timer === null) return;
        startDrag(card);
    }, 180);
});

function startDrag(card) {
    card.classList.add('is-dragging');
    document.body.classList.add('dragging-active');

    const onMove = (ev) => {
        ev.preventDefault();
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const over = el && el.closest && el.closest('.file-card, .album-card');
        if (!over || over === card || over.parentNode !== galleryEl) return;

        const r = over.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;

        let after;
        if (ev.clientY < r.top) after = false;
        else if (ev.clientY > r.bottom) after = true;
        else after = ev.clientX > cx;

        if (after) galleryEl.insertBefore(card, over.nextSibling);
        else galleryEl.insertBefore(card, over);
    };

    const onUp = () => {
        card.classList.remove('is-dragging');
        document.body.classList.remove('dragging-active');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        dragCleanup = null;
    };

    dragCleanup = onUp;
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp, { once: true });
    document.addEventListener('pointercancel', onUp, { once: true });
}

/* ---------------- 文件渲染 ---------------- */
function renderFiles() {
    let list = allFiles;
    let emptyText = '还没有任何文件';

    if (view.startsWith('album:')) {
        const name = view.slice(6);
        list = allFiles.filter(f => f.album === name);
        emptyText = '这个相册还没有文件';
    }

    const items = list.map(f => ({ id: f.path, file: f }));
    const ordered = applyOrder(items, sortKeyForView());

    if (!ordered.length) {
        galleryEl.innerHTML = `<p class="empty">${emptyText}</p>`;
        return;
    }

    galleryEl.innerHTML = '';
    ordered.forEach(it => galleryEl.appendChild(buildFileCard(it.file)));
}

function buildFileCard(file) {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.dataset.id = file.path;

    const ext     = extOf(file.name);
    const isImg   = IMG_EXTS.includes(ext);
    const isAudio = AUDIO_EXTS.includes(ext);
    const url     = publicUrl(file.path);
    const note    = notes[file.path] || '';

    const preview = document.createElement('div');
    preview.className = 'file-preview';

    if (isImg) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = file.name;
        img.src = url;
        img.onerror = () => img.replaceWith(makePh('图片加载失败'));
        img.addEventListener('click', (e) => {
            if (sortState) return;
            e.stopPropagation();
            openLightbox(url, file.name);
        });
        preview.appendChild(img);
    } else if (isAudio) {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;
        preview.appendChild(audio);
    } else {
        preview.appendChild(makePh('无法预览'));
    }

    const info = document.createElement('div');
    info.className = 'file-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'file-name';
    nameEl.textContent = note || file.name;
    nameEl.title = file.name;
    info.appendChild(nameEl);

    if (note) {
        const origin = document.createElement('div');
        origin.className = 'file-origin';
        origin.textContent = file.name;
        info.appendChild(origin);
    }

    /* 链接行 */
    const linkRow = document.createElement('div');
    linkRow.className = 'link-row';

    const input = document.createElement('input');
    input.className = 'file-input';
    input.type = 'text';
    input.readOnly = true;
    input.value = url;
    input.title = '双击可打开链接';

    const btnCopy = document.createElement('button');
    btnCopy.className = 'btn-copy';
    btnCopy.textContent = '复制';
    btnCopy.onclick = (e) => { e.stopPropagation(); copyLink(url); };

    linkRow.append(input, btnCopy);

    linkRow.addEventListener('dblclick', (e) => {
        e.preventDefault();
        window.open(url, '_blank', 'noopener');
    });

    info.appendChild(linkRow);

    /* 操作按钮 */
    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const btnNote = document.createElement('button');
    btnNote.textContent = '备注';
    btnNote.onclick = (e) => { e.stopPropagation(); editNote(file.path); };

    const btnMove = document.createElement('button');
    btnMove.textContent = '移入相册';
    btnMove.onclick = (e) => { e.stopPropagation(); moveFileToAlbum(file); };

    const btnDel = document.createElement('button');
    btnDel.textContent = '删除';
    btnDel.className = 'btn-del';
    btnDel.onclick = (e) => { e.stopPropagation(); deleteFile(file); };

    actions.append(btnNote, btnMove, btnDel);
    info.appendChild(actions);

    card.append(preview, info);
    return card;
}

/* ---------------- 相册渲染 ---------------- */
function renderAlbums() {
    const albums = albumList();

    const items = albums.map(n => ({ id: n, name: n }));
    const ordered = applyOrder(items, 'albums');

    if (!ordered.length) {
        galleryEl.innerHTML = '<p class="empty">还没有相册</p>';
        return;
    }

    galleryEl.innerHTML = '';
    ordered.forEach(it => galleryEl.appendChild(buildAlbumCard(it.name)));
}

function buildAlbumCard(name) {
    const card = document.createElement('div');
    card.className = 'album-card';
    card.dataset.id = name;

    const count = countOfAlbum(name);
    const cover = coverOfAlbum(name);

    const coverEl = document.createElement('div');
    coverEl.className = 'album-cover';

    if (cover) {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = name;
        img.src = cover;
        img.onerror = () => img.replaceWith(makePh('相册'));
        coverEl.appendChild(img);
    } else {
        coverEl.appendChild(makePh('相册'));
    }

    const info = document.createElement('div');
    info.className = 'album-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'album-name';
    nameEl.textContent = name;
    nameEl.title = name;
    info.appendChild(nameEl);

    const meta = document.createElement('div');
    meta.className = 'album-meta';
    meta.textContent = `${count} 个文件`;
    info.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const btnRename = document.createElement('button');
    btnRename.textContent = '重命名';
    btnRename.onclick = (e) => {
        e.stopPropagation();
        renameAlbum(name);
    };
    actions.appendChild(btnRename);

    info.appendChild(actions);
    card.append(coverEl, info);

    card.onclick = () => {
        if (sortState) return;
        view = 'album:' + name;
        render();
    };

    return card;
}

/* ---------------- 文件备注 ---------------- */
function editNote(path) {
    const cur = notes[path] || '';
    const val = prompt('给这个文件加个备注名称（留空则清除备注）：', cur);
    if (val === null) return;

    const t = val.trim();
    if (t) notes[path] = t;
    else delete notes[path];

    localStorage.setItem('gh_notes', JSON.stringify(notes));
    render();
    showToast(t ? '备注已保存' : '备注已清除');
}

/* ---------------- 复制 ---------------- */
function copyLink(url) {
    const done = () => showToast('链接已复制');
    const fail = () => showToast('复制失败，请手动复制', true);

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(done).catch(fail);
    } else {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { fail(); }
        document.body.removeChild(ta);
    }
}

/* ---------------- 底层读写 ---------------- */
async function readFileBase64(path) {
    const res = await fetch(`${contentsUrl(path)}?ref=${BRANCH}`, {
        headers: apiHeaders(),
        cache: 'no-store'
    });
    if (!res.ok) throw new Error(`读取 ${path} 失败`);

    const j = await res.json();
    if (j.content && j.encoding === 'base64') {
        return j.content.replace(/\n/g, '');
    }
    if (!j.download_url) throw new Error(`无法读取 ${path} 内容`);

    const raw = await fetch(j.download_url, { cache: 'no-store' });
    if (!raw.ok) throw new Error(`下载 ${path} 失败`);
    const buf = await raw.arrayBuffer();
    return arrayBufferToBase64(buf);
}

async function putFile(path, base64, message) {
    let sha = null;
    try {
        const head = await fetch(`${contentsUrl(path)}?ref=${BRANCH}`, {
            headers: apiHeaders(),
            cache: 'no-store'
        });
        if (head.ok) {
            const j = await head.json().catch(() => null);
            if (j && j.sha) sha = j.sha;
        }
    } catch (_) {}

    const payload = { message, content: base64, branch: BRANCH };
    if (sha) payload.sha = sha;

    const res = await fetch(contentsUrl(path), {
        method: 'PUT',
        headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `写入 ${path} 失败`);
    }
    return res.json();
}

async function deletePath(path, sha, message) {
    const res = await fetch(contentsUrl(path), {
        method: 'DELETE',
        headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sha, branch: BRANCH })
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `删除 ${path} 失败`);
    }
}

/* 入口：点击卡片上的「移入相册」按钮 */
function moveFileToAlbum(file) {
    if (!token) { showToast('请先设置 Token！', true); return; }

    pendingMoveFile = file;
    albumModalFileNameEl.textContent = '文件：' + file.name;

    const current = file.album || '';
    const albums  = albumList();

    albumChoiceListEl.innerHTML = '';

    /* —— 未分类（根目录） —— */
    const rootBtn = document.createElement('button');
    rootBtn.className = 'album-choice root' + (current === '' ? ' current' : '');
    rootBtn.textContent = '未分类（根目录）';
    rootBtn.disabled = (current === '');
    rootBtn.onclick = () => {
        if (current === '') return;
        closeAlbumPicker();
        doMoveFile(file, '');
    };
    albumChoiceListEl.appendChild(rootBtn);

    /* —— 现有相册 —— */
    albums.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'album-choice' + (current === name ? ' current' : '');
        btn.textContent = name;
        btn.disabled = (current === name);
        btn.onclick = () => {
            if (current === name) return;
            closeAlbumPicker();
            doMoveFile(file, name);
        };
        albumChoiceListEl.appendChild(btn);
    });

    newAlbumInputEl.value = '';
    albumModalEl.classList.add('show');
    setTimeout(() => newAlbumInputEl.focus(), 60);
}

function closeAlbumPicker() {
    albumModalEl.classList.remove('show');
    pendingMoveFile = null;
}

document.getElementById('albumModalCancel').onclick = closeAlbumPicker;

albumModalEl.addEventListener('click', (e) => {
    if (e.target === albumModalEl) closeAlbumPicker();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && albumModalEl.classList.contains('show')) closeAlbumPicker();
});

/* 新建相册并移入 */
document.getElementById('newAlbumBtn').onclick = () => {
    if (!pendingMoveFile) return;
    const raw = newAlbumInputEl.value.trim().replace(/[\/\\]/g, '');
    if (!raw) { showToast('相册名不能为空', true); return; }
    const file = pendingMoveFile;
    closeAlbumPicker();
    doMoveFile(file, raw);
};

newAlbumInputEl.addEventListener('keydown', (e) => {

        e.preventDefault();
        document.getElementById('newAlbumBtn').click();
    }
});

/* 真正的移动逻辑：target 为空字符串表示移出到根目录 */
async function doMoveFile(file, target) {
    if (!token) { showToast('请先设置 Token！', true); return; }

    target = String(target || '').trim().replace(/[\/\\]/g, '');
    const current = file.album || '';

    if (target === current) { showToast('相册未变化'); return; }

    const newPath = target ? `${target}/${file.name}` : file.name;

    const existing = allFiles.find(f => f.path === newPath);
if (existing && existing.sha !== file.sha) {
    showToast(`目标位置已有同名文件：${file.name}`, true);
    return;
    }

    showToast('正在移动…');
    try {
        /* 1) 读取原文件内容 */
        const base64 = await readFileBase64(file.path);

        /* 2) 写入新位置（GitHub API 会自动创建目标目录） */
        await putFile(newPath, base64, `Move ${file.path} -> ${newPath}`);

        /* 3) 删除旧位置 */
        await deletePath(file.path, file.sha, `Move ${file.path} -> ${newPath}`);

        /* 4) 备注跟随迁移 */
        if (notes[file.path]) {
            notes[newPath] = notes[file.path];
            delete notes[file.path];
            localStorage.setItem('gh_notes', JSON.stringify(notes));
        }

        /* 5) 登记新相册 */
        if (target && !albumRegistry.includes(target)) {
            albumRegistry.push(target);
            localStorage.setItem('gh_albums', JSON.stringify(albumRegistry));
        }

        showToast(target ? `已移入「${target}」` : '已移出到「未分类」');
        await loadGallery();
    } catch (err) {
        showToast(`移动失败：${err.message}`, true);
        console.error(err);
    }
}

/* ---------------- 相册重命名 ---------------- */
async function renameAlbum(name) {
    if (!token) { showToast('请先设置 Token！', true); return; }

    const raw = prompt(`更改相册「${name}」的名称：`, name);
    if (raw === null) return;

    const newName = raw.trim().replace(/[\/\\]/g, '');
    if (!newName) { showToast('名称不能为空', true); return; }
    if (newName === name) return;
    if (albumList().includes(newName)) { showToast('已存在同名相册', true); return; }

    const files = allFiles.filter(f => f.album === name);

    if (!files.length) {
        finishRename(name, newName, []);
        render();
        showToast(`相册已更名为「${newName}」`);
        return;
    }

    if (!confirm(`将把 ${files.length} 个文件移动到「${newName}」，确认？`)) return;

    showToast('正在重命名相册…');
    try {
        for (const f of files) {
            const base64 = await readFileBase64(f.path);
            const newPath = `${newName}/${f.name}`;
            await putFile(newPath, base64, `Rename album ${name} -> ${newName}`);
            await deletePath(f.path, f.sha, `Rename album ${name} -> ${newName}`);
        }

        finishRename(name, newName, files);
        showToast(`相册已更名为「${newName}」`);
        await loadGallery();
    } catch (err) {
        showToast(`重命名失败：${err.message}`, true);
        console.error(err);
    }
}

function finishRename(oldName, newName, files) {
    const i = albumRegistry.indexOf(oldName);
    if (i >= 0) albumRegistry[i] = newName;
    if (!albumRegistry.includes(newName)) albumRegistry.push(newName);
    localStorage.setItem('gh_albums', JSON.stringify(albumRegistry));

    if (orders['album:' + oldName]) {
        orders['album:' + newName] = orders['album:' + oldName];
        delete orders['album:' + oldName];
    }
    if (Array.isArray(orders['albums'])) {
        orders['albums'] = orders['albums'].map(n => n === oldName ? newName : n);
    }
    localStorage.setItem('gh_order', JSON.stringify(orders));

    if (files && files.length) {
        const next = {};
        const map = new Map(files.map(f => [f.path, `${newName}/${f.name}`]));
        Object.keys(notes).forEach(k => {
            next[map.has(k) ? map.get(k) : k] = notes[k];
        });
        notes = next;
        localStorage.setItem('gh_notes', JSON.stringify(notes));
    }

    if (view === 'album:' + oldName) view = 'album:' + newName;
}

/* ---------------- 上传 ---------------- */
function createProgressItem(fileName) {
    const item = document.createElement('div');
    item.className = 'progress-item';
    item.innerHTML = `
        <div class="row">
            <span class="name">${escapeHtml(fileName)}</span>
            <span class="status">上传中…</span>
        </div>
        <div class="bar"><div></div></div>
    `;
    document.getElementById('progressList').appendChild(item);

    return {
        setStatus(text, cls) {
            const s = item.querySelector('.status');
            s.textContent = text;
            s.className = 'status' + (cls ? ' ' + cls : '');
        },
        setProgress(p) {
            item.querySelector('.bar > div').style.width = p + '%';
        },
        removeLater() {
            setTimeout(() => item.remove(), 4000);
        }
    };
}

async function uploadFile(file) {
    if (!token) { showToast('请先设置 Token！', true); return; }
    if (file.size > MAX_SIZE) {
        showToast(`${file.name} 超过 20MB，已跳过`, true);
        return;
    }

    const album = document.getElementById('albumSelect').value || '';
    const path  = album ? `${album}/${file.name}` : file.name;
    const ui    = createProgressItem(file.name);
    let timer   = null;

    try {
        const base64 = await fileToBase64(file);

        let pct = 0;
        timer = setInterval(() => {
            pct = Math.min(pct + Math.random() * 12 + 4, 90);
            ui.setProgress(pct);
        }, 180);

        let sha = null;
        try {
            const head = await fetch(`${contentsUrl(path)}?ref=${BRANCH}`, {
                headers: apiHeaders(),
                cache: 'no-store'
            });
            if (head.ok) {
                const j = await head.json().catch(() => null);
                if (j && j.sha) sha = j.sha;
            }
        } catch (_) {}

        const payload = {
            message: `Upload ${path}`,
            content: base64,
            branch: BRANCH
        };
        if (sha) payload.sha = sha;

        const res = await fetch(contentsUrl(path), {
            method: 'PUT',
            headers: { ...apiHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        clearInterval(timer); timer = null;
        ui.setProgress(100);

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `上传失败 (${res.status})`);
        }

        ui.setStatus(sha ? '已覆盖' : '完成', 'success');
        ui.removeLater();
        showToast(`${file.name} 上传成功`);
        loadGallery();
    } catch (err) {
        if (timer) clearInterval(timer);
        ui.setStatus('失败', 'error');
        ui.removeLater();
        showToast(`${file.name} 上传失败：${err.message}`, true);
        console.error(err);
    }
}

/* ---------------- 删除文件 ---------------- */
async function deleteFile(file) {
    if (!confirm(`确定要删除「${file.name}」吗？`)) return;
    if (!token) { showToast('请先设置 Token！', true); return; }

    try {
        await deletePath(file.path, file.sha, `Delete ${file.name}`);

        delete notes[file.path];
        localStorage.setItem('gh_notes', JSON.stringify(notes));

        showToast(`${file.name} 已删除`);
        loadGallery();
    } catch (err) {
        showToast(`删除失败：${err.message}`, true);
    }
}

/* ---------------- 相册下拉 & 新建 ---------------- */
function renderAlbumOptions() {
    const sel = document.getElementById('albumSelect');
    const prev = sel.value;

    sel.innerHTML = '<option value="">未分类（根目录）</option>' +
        albumList().map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');

    if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function addAlbum() {
    const raw = prompt('新相册名称（会作为仓库里的文件夹）：');
    if (raw === null) return;

    const name = raw.trim().replace(/[\/\\]/g, '');
    if (!name) { showToast('相册名不能为空', true); return; }

    if (!albumRegistry.includes(name)) {
        albumRegistry.push(name);
        localStorage.setItem('gh_albums', JSON.stringify(albumRegistry));
    }

    renderAlbumOptions();
    document.getElementById('albumSelect').value = name;

    view = 'albums';
    render();
    showToast(`已创建相册「${name}」，上传后即可看到内容`);
}

/* ---------------- 文件选择 / 拖拽上传 ---------------- */
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
});

document.getElementById('fileInput').addEventListener('change', e => {
    handleFiles(e.target.files);
    e.target.value = '';
});

function handleFiles(files) {
    if (!files || !files.length) return;

    Array.from(files).forEach(file => {
        const ext = extOf(file.name);
        if (VALID_EXTS.includes(ext)) {
            uploadFile(file);
        } else {
            showToast(`不支持的文件格式：${file.name}`, true);
        }
    });
}

/* ---------------- 搜索功能 ---------------- */
function scrollToCard(card) {
    document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));
    card.classList.add('search-highlight');

    const headerH = 64;
    const galleryHeaderEl = document.getElementById('galleryHeader');
    const stickyH = headerH + (galleryHeaderEl ? galleryHeaderEl.offsetHeight : 0);

    const desiredTop = Math.max(window.innerHeight * 0.24, stickyH + 16);

    const rect = card.getBoundingClientRect();
    const targetTop = window.scrollY + rect.top - desiredTop;

    window.scrollTo({
        top: Math.max(0, targetTop),
        behavior: 'smooth'
    });

    setTimeout(() => card.classList.remove('search-highlight'), 3000);
}

document.getElementById('searchInput').addEventListener('input', function (e) {
    const query = e.target.value.trim().toLowerCase();
    if (!query) {
        document.querySelectorAll('.search-highlight').forEach(el => el.classList.remove('search-highlight'));
        return;
    }

    if (view === 'albums') {
        const cards = document.querySelectorAll('.album-card');
        for (const card of cards) {
            const name = (card.dataset.id || '').toLowerCase();
            if (name.includes(query)) {
                scrollToCard(card);
                return;
            }
        }
    } else {
        const cards = document.querySelectorAll('.file-card');
        for (const card of cards) {
            const path = card.dataset.id;
            const file = allFiles.find(f => f.path === path);
            if (!file) continue;
            const note = (notes[path] || '').toLowerCase();
            const fileName = file.name.toLowerCase();
            if (note.includes(query) || fileName.includes(query)) {
                scrollToCard(card);
                return;
            }
        }
    }
});

/* ---------------- 初始化 ---------------- */
if (USERNAME === '你的用户名' || REPO === '你的仓库名') {
    alert('请先在代码顶部修改 USERNAME 和 REPO 变量！');
}

loadGallery();
</script>
